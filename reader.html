<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b4c5a">
<title>Lendo…</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="reader-body">
<div class="reader-shell">
  <div class="reader-toolbar">
    <button id="back-btn" class="btn-icon" aria-label="Voltar">←</button>
    <div class="title" id="reader-title">Carregando…</div>
    <button id="focus-btn" class="btn-icon" aria-label="Modo foco">◎</button>
    <button id="settings-btn" class="btn-icon" aria-label="Configurações">⚙</button>
  </div>

  <div class="reader-viewport">
    <div id="epub-viewer" class="hidden"></div>
    <div id="pdf-viewer" class="hidden"><canvas id="pdf-canvas"></canvas></div>
    <div class="reader-tap-zones">
      <div class="zone" id="zone-prev"></div>
      <div class="zone" id="zone-toggle" style="flex: 0.6"></div>
      <div class="zone" id="zone-next"></div>
    </div>
  </div>

  <div class="reader-footer">
    <button id="prev-btn" class="btn-icon">‹</button>
    <input type="range" id="progress-slider" min="0" max="1000" value="0">
    <button id="next-btn" class="btn-icon">›</button>
    <span class="loc-label" id="loc-label">—</span>
  </div>
</div>

<div id="settings-panel" class="settings-panel hidden">
  <div class="sheet">
    <h2>Aparência</h2>

    <div class="settings-row">
      <label>Tema</label>
      <div class="theme-options">
        <button class="theme-swatch theme-light" data-theme="light" aria-label="Claro"></button>
        <button class="theme-swatch theme-dark" data-theme="dark" aria-label="Escuro"></button>
        <button class="theme-swatch theme-sepia" data-theme="sepia" aria-label="Sépia"></button>
      </div>
    </div>

    <div id="epub-settings">
      <div class="settings-row">
        <label>Tamanho da fonte</label>
        <div class="stepper">
          <button class="btn" id="font-dec">A-</button>
          <span id="font-size-label">100%</span>
          <button class="btn" id="font-inc">A+</button>
        </div>
      </div>
      <div class="settings-row">
        <label>Espaçamento entre linhas</label>
        <div class="stepper">
          <button class="btn" id="spacing-dec">-</button>
          <span id="spacing-label">1.4</span>
          <button class="btn" id="spacing-inc">+</button>
        </div>
      </div>
      <div class="settings-row">
        <label>Fonte</label>
        <div class="font-options">
          <button class="font-option" data-font="serif">Serifada</button>
          <button class="font-option" data-font="sans-serif">Sem serifa</button>
        </div>
      </div>
    </div>

    <div id="pdf-settings" class="hidden">
      <div class="settings-row">
        <label>Zoom</label>
        <div class="stepper">
          <button class="btn" id="zoom-dec">-</button>
          <span id="zoom-label">100%</span>
          <button class="btn" id="zoom-inc">+</button>
        </div>
      </div>
    </div>

    <div class="settings-row">
      <label>Ajuste de cor por horário</label>
      <div class="stepper">
        <button class="btn toggle-btn" id="time-color-toggle">Desativado</button>
        <span style="font-size:0.75rem; color: var(--text-muted);">esquenta a tela à noite</span>
      </div>
    </div>

    <div class="settings-row">
      <label>Modo foco — duração do bloco / pausa (min)</label>
      <div class="stepper">
        <button class="btn" id="focus-work-dec">-</button>
        <span id="focus-work-label">25</span>
        <button class="btn" id="focus-work-inc">+</button>
        <span style="width:6px;"></span>
        <button class="btn" id="focus-break-dec">-</button>
        <span id="focus-break-label">5</span>
        <button class="btn" id="focus-break-inc">+</button>
      </div>
    </div>

    <button class="btn" id="settings-close" style="width:100%; margin-top: 8px;">Fechar</button>
  </div>
</div>

<div id="focus-widget" class="focus-widget hidden">
  <button id="focus-toggle-run" class="btn-icon" aria-label="Pausar/retomar">⏸</button>
  <span id="focus-time-label">25:00</span>
  <span id="focus-phase-label" class="focus-phase">foco</span>
  <button id="focus-exit" class="btn-icon" aria-label="Sair do modo foco">✕</button>
</div>

<div id="break-overlay" class="break-overlay hidden">
  <div class="break-card">
    <p>Hora de uma pausa 🌿</p>
    <div id="break-time-label" class="break-time">05:00</div>
    <button id="break-skip" class="btn btn-primary">Continuar lendo</button>
  </div>
</div>

<script src="js/db.js"></script>
<script src="js/reader.js"></script>
</body>
</html>
