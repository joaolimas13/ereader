<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b4c5a">
<title>Meu Leitor</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="app-header">
  <h1>Minha Biblioteca</h1>
  <div>
    <button id="import-btn" class="btn btn-primary">+ Adicionar</button>
    <input type="file" id="import-input" accept=".epub,.pdf,application/epub+zip,application/pdf" multiple>
  </div>
</header>

<main>
  <div id="empty-state" class="empty-state hidden">
    <p>Nenhum livro ainda.</p>
    <p>Toque em "Adicionar" para importar um EPUB ou PDF do seu tablet.</p>
  </div>
  <div id="library-grid" class="library-grid"></div>
</main>

<div id="context-sheet" class="book-context hidden">
  <div class="sheet">
    <button id="ctx-open">Abrir</button>
    <button id="ctx-restart">Reiniciar progresso</button>
    <button id="ctx-remove" class="danger">Remover da biblioteca</button>
    <button id="ctx-cancel">Cancelar</button>
  </div>
</div>

<script src="js/db.js"></script>
<script src="js/library.js"></script>
</body>
</html>
